server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CorrelationIdFilter
            - name: JwtFilter
        - id: catalogo-service
          uri: http://catalogo-service:8082
          predicates:
            - Path=/api/v1/comercios/**
          filters:
            - name: CorrelationIdFilter
            - name: JwtFilter
        - id: pedidos-service
          uri: http://pedidos-service:8083
          predicates:
            - Path=/api/v1/pedidos/**
          filters:
            - name: CorrelationIdFilter
            - name: JwtFilter
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:your-secret-key-minimum-32-characters}
