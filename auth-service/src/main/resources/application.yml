server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://postgres:admin@postgres:5432/auth_db
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:your-secret-key-minimum-32-characters-for-development}
  expiration: 86400000

app:
  rate-limit:
    login:
      max-attempts: 5
      window-seconds: 60
    general:
      max-requests: 100
      window-seconds: 60
