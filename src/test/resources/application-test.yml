spring:
  datasource:
    url: jdbc:tc:postgresql:15:///delivery?TC_DAEMON=true
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
        jakarta:
          persistence:
            lock:
              timeout: 5000
